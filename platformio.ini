; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5capsule]
platform = espressif32@6.7.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-I include
lib_deps = 
	m5stack/M5Unit-NFC@^0.0.2
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8
	m5stack/M5Unified@^0.2.14

[env:m5stickc_plus]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-I include
lib_deps = 
	m5stack/M5Unit-NFC@^0.0.2
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8
	m5stack/M5Unified@^0.2.14

[env:m5stickc_plus_nfc_diag]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DAPP_NFC_DIAGNOSTIC=1
	-I include
lib_deps = 
	m5stack/M5Unit-NFC@^0.0.2
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8
	m5stack/M5Unified@^0.2.14

[env:waveshare_esp32_epd]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ignore =
	UnitNfcTransport
	WaveshareNfcEpaper
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DAPP_WAVESHARE_ESP32_DRIVER=1
	-I include
lib_deps =
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8

[env:waveshare_esp32_epd_diag]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_DIAGNOSTIC=1

[env:waveshare_esp32_epd_7in5bc]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_7IN5BC=1

[env:waveshare_esp32_epd_7in5bc_diag]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_DIAGNOSTIC=1
	-DAPP_EPD_7IN5BC=1
