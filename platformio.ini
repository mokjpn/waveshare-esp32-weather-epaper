; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Default target: newer Waveshare 7.5inch e-Paper, 800x480 black/white
; panel using its 4-level grayscale refresh path for the weather-map workflow.
[platformio]
default_envs = waveshare_esp32_epd

[env:waveshare_esp32_epd]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DAPP_WAVESHARE_ESP32_DRIVER=1
	-I include
lib_deps =
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8

[env:waveshare_esp32_epd_diag]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_DIAGNOSTIC=1

; Newer 800x480 panel, but force the older 1bpp black/white firmware contract.
; Pair this with relay option: --output-format 1bpp
[env:waveshare_esp32_epd_1bpp]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_1BPP=1

[env:waveshare_esp32_epd_1bpp_diag]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_DIAGNOSTIC=1
	-DAPP_EPD_1BPP=1

; Legacy target for the older 7.5inch e-Paper (B) X02R/171213-180502 panel
; path. Build explicitly with:
;   PLATFORMIO_CORE_DIR=/tmp/pio-core pio run -e waveshare_esp32_epd_7in5bc
[env:waveshare_esp32_epd_7in5bc]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_7IN5BC=1

[env:waveshare_esp32_epd_7in5bc_diag]
extends = env:waveshare_esp32_epd
build_flags =
	${env:waveshare_esp32_epd.build_flags}
	-DAPP_EPD_DIAGNOSTIC=1
	-DAPP_EPD_7IN5BC=1
